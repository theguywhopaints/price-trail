name: Scrape Live Prices

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:          # Manual trigger from GitHub UI

permissions:
  contents: write             # Allow the bot to commit scraped prices back to the repo

jobs:
  scrape:
    runs-on: self-hosted      # Uses your Mac — residential IP bypasses Incapsula

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run price scraper
        run: node scripts/scrape-prices.js
        env:
          SCRAPE_QUERIES: ${{ vars.SCRAPE_QUERIES }}

      - name: Commit scraped prices if changed
        run: |
          git config user.name  "PriceTrail Bot"
          git config user.email "bot@pricetrail.app"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/theguywhopaints/price-trail.git
          git add src/data/scraped-prices.json
          if git diff --staged --quiet; then
            echo "No price changes — nothing to commit."
          else
            git commit -m "chore: refresh scraped prices $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
